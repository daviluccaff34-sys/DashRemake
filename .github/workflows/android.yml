name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Game/**"
      - "cocos2d-x"
      - ".gitmodules"
      - ".github/workflows/android.yml"

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Download Cocos2d-x engine only
        run: git submodule update --init --depth 1 cocos2d-x

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;28.0.3" "ndk;20.1.5948944" "cmake;3.10.2.4988404"

      - name: Switch to Java 8 for legacy Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Build debug APK
        working-directory: Game/proj.android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/20.1.5948944"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DashRemake-debug
          path: Game/proj.android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
